<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorStudio Pro - Monochrome & Color Theory Image Processor</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="logo">ColorStudio <span>Pro</span></h1>
            <p class="tagline">Professional Color Theory Image Processing</p>
        </header>

        <main class="main-content">
            <!-- File Upload Section -->
            <section class="upload-section" id="upload-section">
                <div class="upload-card">
                    <h2>Upload Your Image</h2>
                    <form id="upload-form" 
                          hx-post="/process" 
                          hx-target="#processing-result" 
                          hx-swap="innerHTML"
                          enctype="multipart/form-data">
                        
                        <div class="file-drop-zone" id="drop-zone">
                            <input type="file" 
                                   id="image-input" 
                                   name="image" 
                                   accept="image/*" 
                                   required
                                   class="file-input">
                            <label for="image-input" class="file-label">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                    <polyline points="17 8 12 3 7 8"/>
                                    <line x1="12" y1="3" x2="12" y2="15"/>
                                </svg>
                                <span>Click to upload or drag & drop</span>
                                <small>PNG, JPG, GIF up to 10MB</small>
                            </label>
                        </div>
                        
                        <div class="preview-container" id="preview-container" style="display: none;">
                            <img id="image-preview" src="#" alt="Preview">
                            <button type="button" class="btn-remove" id="remove-image">×</button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Processing Controls -->
            <section class="processing-controls" id="processing-controls" style="display: none;">
                <div class="controls-card">
                    <h2>Processing Options</h2>
                    
                    <div class="color-picker-section">
                        <label for="base-color">Base Color</label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="base-color" value="#336699">
                            <input type="text" id="hex-input" value="#336699" maxlength="7">
                        </div>
                    </div>

                    <div class="color-scheme-section">
                        <label>Color Scheme</label>
                        <div class="scheme-buttons">
                            <button class="scheme-btn active" data-scheme="monochrome">Monochrome</button>
                            <button class="scheme-btn" data-scheme="analogous">Analogous</button>
                            <button class="scheme-btn" data-scheme="complementary">Complementary</button>
                            <button class="scheme-btn" data-scheme="triadic">Triadic</button>
                            <button class="scheme-btn" data-scheme="greyscale">Greyscale</button>
                        </div>
                    </div>

                    <div class="intensity-section">
                        <label for="intensity">Color Intensity: <span id="intensity-value">70%</span></label>
                        <input type="range" id="intensity" min="0" max="100" value="70">
                    </div>

                    <button class="process-btn" id="process-btn">Process Image</button>
                </div>
            </section>

            <!-- Results Section -->
            <section class="results-section" id="processing-result">
                <!-- HTMX will inject results here -->
            </section>
        </main>

        <footer class="footer">
            <p>Built with HTMX & Canvas API | Color Theory Implementation</p>
        </footer>
    </div>

    <script src="color-theory.js"></script>
    <script src="image-processor.js"></script>
    <script src="app.js"></script>
</body>
</html>
